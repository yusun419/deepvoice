<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>딥보이스 수사본부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 수사 파일철 — 상단 사건 띠(폴리스 라인 줄무늬) + 단계 표시줄, 본문은 종이 한 장 폭의 단일 칼럼, 하단 고정 이동 버튼 */
:root{
  --bg:#E8EAE4; --paper:#FBFBF8; --soft:#F0F1EC; --ink:#1C2230; --muted:#5B6371; --line:#CBD0C7;
  --accent:#D9A400; --accent-ink:#1C2230;
  --logic:#244A8C; --logic-soft:#E2E9F5;
  --stamp:#C3352B; --stamp-soft:#F7E3E0;
  --ok:#2A7849; --ok-soft:#DFF0E5;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono","Cambria Math","Segoe UI Symbol",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141A; --paper:#1A1F28; --soft:#222833; --ink:#E6E8EC; --muted:#9AA2B0; --line:#2F3643;
  --accent:#E8BC2E; --accent-ink:#11141A;
  --logic:#93B4F2; --logic-soft:#1E2A40;
  --stamp:#F26B5F; --stamp-soft:#3A201F;
  --ok:#63C98F; --ok-soft:#173020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141A; --paper:#1A1F28; --soft:#222833; --ink:#E6E8EC; --muted:#9AA2B0; --line:#2F3643;
  --accent:#E8BC2E; --accent-ink:#11141A;
  --logic:#93B4F2; --logic-soft:#1E2A40;
  --stamp:#F26B5F; --stamp-soft:#3A201F;
  --ok:#63C98F; --ok-soft:#173020; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--paper)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tape{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--ink) 12px 24px)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.brand{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;line-height:1.1}
.caseno{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.hspace{flex:1}
.mycard-btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.steps{display:flex;gap:4px;padding-block:4px 10px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;border:1px solid var(--line);background:var(--soft);border-radius:4px;padding:3px 8px;font-size:12px;color:var(--muted);white-space:nowrap}
.st[data-state="done"]{background:var(--paper);color:var(--ink)}
.st[data-state="now"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.st[disabled]{cursor:not-allowed;opacity:.55}
.st .n{font-family:var(--f-mono);margin-right:4px}

main{padding-block:20px 120px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.25;margin:4px 0 6px;text-wrap:balance}
h2{font-size:17px;margin:0 0 8px;text-wrap:balance}
h3{font-size:15px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px}
p{margin:0 0 10px}
.stack{display:flex;flex-direction:column;gap:14px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}
.sheet.tight{padding:14px}
.note{font-size:13.5px;color:var(--muted)}
.sym{font-family:var(--f-mono);font-weight:600;color:var(--logic);white-space:nowrap}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.legend .sym{text-align:right}

/* form bits */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,textarea{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.btn{border:none;border-radius:6px;padding:10px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:0 0 auto}

/* role picker */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.role{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.role .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.role b{font-size:16px}
.role span{font-size:13px;color:var(--muted)}

/* message */
.msg{border-radius:6px;padding:10px 12px;font-size:14px;border:1px solid}
.msg.err{background:var(--stamp-soft);border-color:var(--stamp);color:var(--ink)}
.msg.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.msg.info{background:var(--logic-soft);border-color:var(--logic);color:var(--ink)}
.msg b{font-weight:700}

/* article */
.article{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px}
.article .kicker{font-size:12px;font-weight:700;color:var(--stamp);letter-spacing:.04em}
.article h2{font-size:21px;line-height:1.35;margin:6px 0 10px}
.article .by{font-size:12px;color:var(--muted);margin-bottom:12px;font-family:var(--f-mono)}
.fake{display:inline-block;font-size:11px;border:1px solid var(--muted);color:var(--muted);border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.quote{border-left:4px solid var(--accent);padding:6px 12px;margin:0 0 12px;font-weight:600}

/* evidence card */
.evi{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.evi .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;background:var(--soft);border-bottom:1px dashed var(--line);font-size:13px}
.evi .hd b{font-size:14.5px}
.evi .bd{padding:12px 14px}
.evi ul{margin:0;padding-left:18px}
.evi li{margin:2px 0}
.secret{border:2px dashed var(--stamp);background:var(--stamp-soft);border-radius:8px;padding:14px}
.secret .eyebrow{color:var(--stamp)}

/* board option cards */
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 12px;font-size:14.5px}
.opt[aria-pressed="true"]{border-color:var(--logic);background:var(--logic-soft);box-shadow:inset 0 0 0 1px var(--logic)}
.opt.locked{border-style:dashed;cursor:default}
.clue{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.clue .lab{font-family:var(--f-mono);font-weight:600;padding-top:9px}
.lockt{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:4px}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.board{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
table.board th,table.board td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
table.board th{font-size:12.5px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:var(--paper);padding:5px 8px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.seg button:disabled{cursor:default}

/* sort + builder */
.sortrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sortrow:last-child{border-bottom:none}
.sortrow .stmt{flex:1 1 220px;min-width:0}
.vars{display:inline-flex;gap:4px}
.var,.neg{width:36px;height:36px;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;font-family:var(--f-mono);font-weight:600;font-size:15px;padding:0}
.var[aria-pressed="true"]{background:var(--logic);border-color:var(--logic);color:var(--paper)}
.neg[aria-pressed="true"]{background:var(--stamp);border-color:var(--stamp);color:var(--paper)}
.var:disabled,.neg:disabled{cursor:default}
.builder{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.side{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.arrow{font-family:var(--f-mono);font-size:20px;color:var(--muted);padding:0 4px}
.preview{font-family:var(--f-mono);font-weight:600;font-size:18px;color:var(--logic);background:var(--logic-soft);border-radius:6px;padding:4px 12px;display:inline-block}
.symrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.symrow:last-child{border-bottom:none}
.okmark{color:var(--ok);font-weight:700}

/* deck */
.modes{display:flex;gap:6px;flex-wrap:wrap}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.pc{position:relative;border:1.5px solid var(--logic);background:var(--paper);border-radius:8px;padding:10px 8px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.pc .f{font-family:var(--f-mono);font-weight:600;font-size:18px;color:var(--logic)}
.pc .o{font-size:11px;color:var(--muted)}
.pc .w{font-size:12px;line-height:1.4;color:var(--ink)}
.mini .w{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;margin-top:2px}
.figure{margin:4px 0 14px}
.figure svg{width:100%;height:auto;display:block;border-radius:2px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.who{font-size:12px;color:var(--logic);font-weight:600}
.pc[data-o="chain"]{border-style:solid;background:var(--logic-soft)}
.pc[data-o="contra"]{border-style:dashed}
.pc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.pc .badge{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pc.new{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.goals{display:flex;flex-direction:column;gap:4px;font-size:14px}
.goal{display:flex;gap:8px;align-items:center}
.goal .box{width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.goal.on .box{background:var(--ok);border-color:var(--ok);color:var(--paper)}

/* suspects */
.suspects{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.suspects{grid-template-columns:repeat(2,1fr)}}
.sus{position:relative;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:12px 10px 46px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.sus[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sus b{font-size:17px}
.sus .facts{font-family:var(--f-mono);font-size:13px;color:var(--logic)}
.sus .nofact{font-size:12px;color:var(--muted)}
.stampmark{position:absolute;right:6px;bottom:8px;transform:rotate(-14deg);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-size:20px;padding:0 8px;border-radius:4px;letter-spacing:.1em;background:var(--paper);opacity:.92}
.stampmark.culprit{border-color:var(--accent);color:var(--ink);background:var(--accent)}
.pickgrid{display:flex;flex-direction:column;gap:12px}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-family:var(--f-mono);font-weight:600;color:var(--logic)}
.mini[aria-pressed="true"]{background:var(--logic);border-color:var(--logic);color:var(--paper)}

/* dialogue */
.dlg{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:0 0 40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.bubble{background:var(--paper);border:1.5px solid var(--ink);border-radius:2px 12px 12px 12px;padding:10px 14px;font-weight:600}

/* phone */
.phone{max-width:300px;margin:0 auto;border:3px solid var(--ink);border-radius:26px;padding:18px 14px;background:var(--soft)}
.phone .ttl{text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:10px}
.phone .row2{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);opacity:0;animation:fadein .4s ease forwards}
.phone .row2:last-child{border-bottom:none}
@keyframes fadein{to{opacity:1}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navin{display:flex;align-items:center;gap:10px;padding-block:10px}
.navin .hint{flex:1;font-size:12.5px;color:var(--muted);min-width:0}

/* hint */
.hintbox{display:flex;flex-direction:column;gap:6px}
.hintbox ol{margin:0;padding-left:20px;font-size:14px}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.modal .box{background:var(--bg);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:12px 12px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* report sheet (항상 밝은 종이 – 캡처용 고정 색) */
.repwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#ffffff}
#sheet{width:680px;background:#ffffff;color:#1C2230;padding:28px 30px;font-family:var(--f-body);font-size:13.5px;line-height:1.55}
#sheet .tp{height:8px;background:repeating-linear-gradient(-45deg,#D9A400 0 12px,#1C2230 12px 24px);margin:-28px -30px 18px}
#sheet h1{font-family:var(--f-display);font-size:26px;margin:0;color:#1C2230}
#sheet .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;margin:12px 0 16px;padding:10px 12px;background:#F3F4EF;border-radius:6px;font-size:12.5px}
#sheet .meta b{color:#5B6371;font-weight:600;margin-right:4px}
#sheet h2{font-size:14.5px;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid #1C2230;color:#1C2230}
#sheet .s{font-family:var(--f-mono);font-weight:600;color:#244A8C}
#sheet table{border-collapse:collapse;width:100%;font-size:12.5px}
#sheet td,#sheet th{border:1px solid #CBD0C7;padding:4px 7px;text-align:left;vertical-align:top}
#sheet th{background:#F3F4EF;font-weight:600}
#sheet .free{background:#FFF8E0;border:1px solid #E6D08A;border-radius:4px;padding:6px 9px;white-space:pre-wrap}
#sheet ul{margin:0;padding-left:18px}
#sheet .foot{margin-top:18px;font-size:11px;color:#5B6371;text-align:right;font-family:var(--f-mono)}
#sheet .bad{color:#C3352B;font-weight:600}
#sheet .good{color:#2A7849;font-weight:600}
.shot img{width:100%;border:1px solid var(--line);border-radius:6px;display:block}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.phone .row2{opacity:1}}
</style>

<header>
  <div class="tape" aria-hidden="true"></div>
  <div class="wrap">
    <div class="hrow">
      <div>
        <div class="brand">딥보이스 수사본부</div>
        <div class="caseno">사건번호 2026-사이버-1102</div>
      </div>
      <div class="hspace"></div>
      <button class="mycard-btn" id="mycardBtn" data-a="openCard" hidden>수사 자료</button>
    </div>
    <nav class="steps" id="steps" aria-label="수사 단계"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="nav">
  <div class="wrap navin">
    <button class="btn ghost small" id="prevBtn" data-a="prev">이전</button>
    <div class="hint" id="navHint"></div>
    <button class="btn" id="nextBtn" data-a="next">다음 단계</button>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- 논리 도구 ---------- */
const V=['p','q','r','s','m'];
const L=(v,n=false)=>({v,n});
const eq=(a,b)=>!!a&&!!b&&a.v===b.v&&!!a.n===!!b.n;
const neg=l=>({v:l.v,n:!l.n});
const ls=l=>(l.n?'~':'')+l.v;
const cid=(a,c)=>ls(a)+'>'+ls(c);
const fm=l=>`<span class="sym">${ls(l)}</span>`;
const fi=(a,c)=>`<span class="sym">${ls(a)} ⟹ ${ls(c)}</span>`;
const PRD={p:'제작자이다','~p':'제작자가 아니다',q:'영상을 내려받았다','~q':'영상을 내려받지 않았다',r:'AI 서버에 접속했다','~r':'AI 서버에 접속하지 않았다',s:'VPN 기록이 있다','~s':'VPN 기록이 없다',m:'현금 수거책이다','~m':'현금 수거책이 아니다'};
const ADN={p:'제작자인','~p':'제작자가 아닌',q:'영상을 내려받은','~q':'영상을 내려받지 않은',r:'AI 서버에 접속한','~r':'AI 서버에 접속하지 않은',s:'VPN 기록이 있는','~s':'VPN 기록이 없는',m:'현금 수거책인','~m':'현금 수거책이 아닌'};

async function makeReport(kind){
 const out=document.getElementById('out-'+kind);const sheet=document.getElementById('sheet');
 const t=S.s10;
 if(kind==='me'&&(t.change||'').trim().length<10){out.innerHTML='<div class="msg err">위 질문의 답을 조금 더 자세히 써 주세요.</div>';return;}
 if(kind==='team'){
  const miss=[];
  [['g1','①'],['g2','②'],['g3','③'],['g4','④']].forEach(([k,n])=>{if((t[k]||'').trim().length<10)miss.push(n);});
  if(miss.length){out.innerHTML=`<div class="msg err">${miss.join(', ')}번 질문을 조금 더 자세히 채워 주세요.</div>`;return;}
 }
 sheet.innerHTML=buildSheet(kind);
 out.innerHTML='<p class="note">이미지를 만드는 중이에요…</p>';
 try{

 }catch(e){
  out.innerHTML='<div class="msg err">이미지를 만들지 못했어요. 아래 보고서 미리보기를 화면 캡처해서 패들렛에 올려 주세요.</div>';
 }
}

/* ---------- 렌더 ---------- */
function render(){
 if(S.step>=3&&S.step<=6)initDeck();
 const main=document.getElementById('main');
 main.innerHTML=VIEWS[S.step]();
 document.getElementById('steps').innerHTML=STEPS.map((t,i)=>{
  const st=i===S.step?'now':(i<=S.max?'done':'');
  return `<button class="st" data-a="go" data-i="${i}" data-state="${st}" ${i>S.max?'disabled':''} ${i===S.step?'aria-current="step"':''}><span class="n">${i}</span>${t}</button>`;
 }).join('');
 const cur=document.querySelector('.st[aria-current]');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}
 document.getElementById('mycardBtn').hidden=!(S.role&&S.step>=2);
 const nb=document.getElementById('nextBtn'),pb=document.getElementById('prevBtn'),nh=document.getElementById('navHint');
 pb.disabled=S.step===0;
 nb.hidden=S.step===STEPS.length-1;
 nb.disabled=!done(S.step);
 nh.textContent=S.step===STEPS.length-1?'수사를 마쳤습니다. 보고서를 제출하세요.':(done(S.step)?`다음: ${STEPS[S.step+1]}`:(NEED[S.step]||''));
 S.s5.last=null;
 save();
}
function rerender(keepScroll){const y=window.scrollY;render();if(keepScroll)window.scrollTo(0,y);}

function goStep(i){
 if(i<0||i>=STEPS.length)return;
 if(i>S.max)return;
 S.step=i;S.msg={};render();window.scrollTo(0,0);
}

 size(d){S.size=+d.n;if(S.role&&!ROLESET[S.size].includes(S.role))S.role=null;},

 /* 3 */

  SUS.forEach(s=>{if(ms.includes(s.id))return;COLS.forEach(col=>{const v=(S.s3.table[s.id]||{})[col.k];if(!v)blank++;else if(v!==s.truth[col.k])wrong++;});});
  if(blank){msg('s3','err',`아직 비어 있는 칸이 <b>${blank}개</b> 있어요. 모둠원에게 물어서 채우세요.`);return;}
  if(wrong){err(3);msg('s3','err',`<b>${wrong}칸</b>이 실제 기록과 달라요. 어느 칸인지는 알려 드릴 수 없어요. 담당자에게 다시 물어보세요.`);return;}
  S.s3.done=true;msg('s3','ok','<b>보드 정리 완료!</b> 모든 정보가 정확합니다. 다음 단계에서 문장을 기호로 바꿔 봅시다.');
 },
 /* 4 */
 svar(d){const o=S.s4.sort[d.id]=S.s4.sort[d.id]||{v:null,n:false};o.v=d.v;delete S.msg.sort;},

   s.deck.push({id,a:A1.a,c:B.c,o:'chain'});s.last=id;

  if(!S.s8.culprit){msg('cul','err','한 명을 고르세요.');return;}
  if(S.s8.culprit!=='ja'){err(8);msg('cul','err',`${SU[S.s8.culprit].name}은(는) 6단계에서 이미 배제된 사람이에요. 배제 근거를 다시 보세요.`);return;}
  S.s8.culOk=true;msg('cul','ok','<b>지아를 제작자로 지목했습니다.</b> 그렇다면 지아에게 p가 참이에요.');
 },
 pred(d){const i=+d.i,a=S.s8.preds;const k=a.indexOf(i);if(k>=0)a.splice(k,1);else a.push(i);delete S.msg.pred;},
 predCheck(){
  const a=S.s8.preds;
  const bad=a.filter(i=>!PRED[i].ok).length,miss=PRED.filter((p,i)=>p.ok&&!a.includes(i)).length;
  if(!a.length){msg('pred','err','예측을 하나 이상 고르세요.');return;}
  if(bad||miss){err(8);msg('pred','err',`${bad?'단서와 반대이거나 단서로 확실히 말할 수 없는 항목이 섞여 있어요. ':''}${miss?'반드시 확인되어야 할 사실이 더 있어요. ':''}p에서 출발하는 카드를 떠올려 보세요.`);return;}
  S.s8.done=true;delete S.msg.pred;
 },
 /* 9 */
 cand(d){const a=S.s9.cands,k=a.indexOf(d.id);if(k>=0)a.splice(k,1);else a.push(d.id);delete S.msg.cand;},
 candCheck(){
  const a=S.s9.cands;
  if(!a.length){msg('cand','err','후보를 한 명 이상 고르세요.');return;}
  const ok=a.length===2&&a.includes('hg')&&a.includes('ja');
  if(ok){S.s9.candOk=true;msg('cand','ok','<b>맞아요.</b> 한결과 지아 두 사람이 남아 제작자를 확정할 수 없어요. p ⟹ q는 있지만 q에서 r로 가는 연결이 끊겨서, 한결의 ~s로는 ~r까지만 알 수 있기 때문이에요.');return;}
  err(9);
  let t='';
  if(a.includes('sy')||a.includes('dh'))t+='서윤(~q ⟹ ~p)과 도현(m ⟹ ~p)을 배제한 근거는 바뀐 단서 (나)와 관계가 있었나요? ';
  if(!a.includes('hg'))t+='한결을 배제했던 ~s ⟹ ~p는 어떤 카드들을 이어서 만들었나요? 그 연결이 지금도 살아 있나요? ';
  if(!a.includes('ja'))t+='지아를 제외할 근거가 있나요? ';
  msg('cand','err',t||'다시 생각해 보세요.');
 },
 fix(d){const i=+d.i,a=S.s9.fixes,k=a.indexOf(i);if(k>=0)a.splice(k,1);else a.push(i);delete S.msg.fix;},
 fixCheck(){
  const a=S.s9.fixes;
  if(!a.length){msg('fix','err','하나 이상 고르세요.');return;}
  if(S.s9.why.trim().length<10){msg('fix','err','설명을 조금 더 자세히 써 주세요.');return;}
  const bad=a.filter(i=>!FIX[i].ok).length,miss=FIX.filter((f,i)=>f.ok&&!a.includes(i)).length;
  if(bad){err(9);msg('fix','err','고른 것 중에 p와 s 사이의 연결을 이어 주지 못하는 단서가 있어요.');return;}
  if(miss){err(9);msg('fix','err','하나 더 있어요. 고른 단서와 <b>같은 뜻</b>인 명제(대우)도 찾아보세요.');return;}
  S.s9.done=true;delete S.msg.fix;
 },
 mk(d){makeReport(d.kind);return 'skip';},
 scene(d){S.s10.scene=d.k;},
};

document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-a]');
 if(!t||t.disabled)return;
 const fn=A[t.dataset.a];if(!fn)return;
 ev.preventDefault();
 const r=fn(t.dataset,t);
 if(r==='skip')return;
 if(r==='top'){render();return;}
 rerender(true);
});
document.getElementById('modal').addEventListener('click',ev=>{if(ev.target.id==='modal')ev.currentTarget.hidden=true;});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.dataset.f){
  const p=t.dataset.f.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=t.value;
  if(S.step===0){const nb=document.getElementById('nextBtn');nb.disabled=!done(0);document.getElementById('navHint').textContent=done(0)?`다음: ${STEPS[1]}`:NEED[0];}
  save();
 }
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.dataset.fb){const p=t.dataset.fb.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=t.checked;save();}
});
render();
})();
</script>
